[project]
name = "e-commerce-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "palminaN", email = "albanmelget@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "notebook>=7.6.3",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.1",
]

[project.scripts]
e-commerce-prediction = "e_commerce_prediction:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
